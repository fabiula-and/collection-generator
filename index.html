<!DOCTYPE html>
<html>

<head>
    <title>Collection Generator</title>
</head>

<body>

    <h1>COLLECTION GENERATOR</h1>

    <p>Um gerador aleatório de direções criativas para criação de moda.</p>


    <h2>🎲 O que você quer gerar?</h2>

    <p><strong>Modo de criação</strong></p>

    <div class="modos">

        <button id="modo-livre">
            🎲 <strong>Livre</strong><br>
            Tudo pode entrar.
        </button>

        <button id="modo-ideia">
            🌱 <strong>Ideia</strong><br>
            Uma ideia simples para começar.
        </button>

        <button id="modo-conceito">
            💡 <strong>Conceito</strong><br>
            Uma direção criativa mais construída.
        </button>

        <button id="modo-imersao">
            🧠 <strong>Imersão</strong><br>
            Um briefing aprofundado.
        </button>

        <button id="modo-estampa">
            🎨 <strong>Estampa</strong><br>
            Direcionado exclusivamente para criação de estampas.
        </button>

        <button id="modo-caos">
            🌀 <strong>Caos</strong><br>
            Complexidade máxima.
        </button>

    </div>


    <br>

    <button id="gerar">🎲 GERAR</button>


    <h2>Resultado</h2>

    <p id="resultado-modo">Modo: <span id="modo"></span></p>

<p id="resultado-tema">Tema: <span id="tema"></span></p>

<p id="resultado-cor">Cor principal: <span id="cor"></span></p>

<p id="resultado-cor-secundaria">Cor secundária: <span id="cor-secundaria"></span></p>

<p id="resultado-material">Material: <span id="material"></span></p>

<p id="resultado-estampa">Estampa: <span id="estampa"></span></p>

<p id="resultado-linguagem">Linguagem: <span id="linguagem"></span></p>

<p id="resultado-atmosfera">Atmosfera: <span id="atmosfera"></span></p>

<p id="resultado-universo">Universo: <span id="universo"></span></p>

<p id="resultado-construcao">Construção: <span id="construcao"></span></p>


    <script src="script.js"></script>

</body>

</html>
