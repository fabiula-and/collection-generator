<!DOCTYPE html>
<html>

<head>
    <title>Collection Generator</title>
</head>

<body>

    <h1>Collection Generator</h1>

    <p>Um gerador aleatório de ideias para coleções de moda.</p>

    <h2>O que você quer criar?</h2>

    <button id="modo-ideia">🌱 Ideia</button>
    <button id="modo-estampa">🎨 Estampa</button>
    <button id="modo-mini">✨ Mini coleção</button>
    <button id="modo-completa">👗 Coleção completa</button>
    <button id="modo-caos">🌀 Caos</button>

    <h2>Qual é a escala?</h2>

    <button id="escala-1peca" class="escala">1 peça</button>
    <button id="escala-1look" class="escala">1 look</button>
    <button id="escala-3looks" class="escala">3 looks</button>
    <button id="escala-5looks" class="escala">5 looks</button>
    <button id="escala-8looks" class="escala">8 looks</button>
    <button id="escala-12looks" class="escala">12 looks</button>
    <button id="escala-15looks" class="escala">15 looks</button>

    <button id="escala-3estampas" class="escala">3 estampas</button>
    <button id="escala-5estampas" class="escala">5 estampas</button>
    <button id="escala-7estampas" class="escala">7 estampas</button>
    <button id="escala-9estampas" class="escala">9 estampas</button>

    <button id="escala-editorial" class="escala">1 editorial</button>

    <button id="gerar">🎲 Gerar</button>

    <h2>Resultado</h2>

    <p>Tema: <span id="tema"></span></p>
    <p>Cor principal: <span id="cor"></span></p>
    <p>Cor secundária: <span id="cor-secundaria"></span></p>
    <p>Material: <span id="material"></span></p>
    <p>Estampa: <span id="estampa"></span></p>
    <p>Linguagem: <span id="linguagem"></span></p>
    <p>Atmosfera: <span id="atmosfera"></span></p>
    <p>Universo: </p>
    <p>Construção: </p>
    <p>Escala: <span id="escala"></span></p>

    <script src="script.js"></script>

</body>

</html>
