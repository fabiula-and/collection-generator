<!DOCTYPE html>
<html>

<head>
    <title>Collection Generator</title>

    <!-- ===== FONTES ===== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- ===== CSS ===== -->

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =====================================================
         TÍTULO
         ===================================================== -->

    <h1>COLLECTION GENERATOR</h1>

    <p>
        Um gerador aleatório de direções criativas para criação de moda.
    </p>


    <!-- =====================================================
         ESCOLHA DO MODO
         ===================================================== -->

    <h2>O QUE VOCÊ QUER GERAR?</h2>

    <p id="titulo-modos">
        <strong>Modo de criação</strong>
    </p>


    <!-- =====================================================
         MODOS
         ===================================================== -->

    <div class="modos">

        <!-- ===== LIVRE ===== -->

        <button id="modo-livre">
            <strong>LIVRE</strong>
            <span>Tudo pode entrar.</span>
        </button>


        <!-- ===== IDEIA ===== -->

        <button id="modo-ideia">
            <strong>IDEIA</strong>
            <span>Uma ideia simples para começar.</span>
        </button>


        <!-- ===== CONCEITO ===== -->

        <button id="modo-conceito">
            <strong>CONCEITO</strong>
            <span>Uma direção criativa mais construída.</span>
        </button>


        <!-- ===== IMERSÃO ===== -->

        <button id="modo-imersao">
            <strong>IMERSÃO</strong>
            <span>Um briefing aprofundado.</span>
        </button>


        <!-- ===== ESTAMPA ===== -->

        <button id="modo-estampa">
            <strong>ESTAMPA</strong>
            <span>Direcionado exclusivamente para criação de estampas.</span>
        </button>


        <!-- ===== CAOS ===== -->

        <button id="modo-caos">
            <strong>CAOS</strong>
            <span>Complexidade máxima.</span>
        </button>

    </div>


    <br>


    <!-- =====================================================
         BOTÃO GERAR
         ===================================================== -->

    <button id="gerar">
        GERAR
    </button>


    <!-- =====================================================
         RESULTADO
         ===================================================== -->

    <h2 id="titulo-resultado">RESULTADO</h2>


    <p id="resultado-modo">
        Modo: <span id="modo"></span>
    </p>


    <p id="resultado-tema">
        Tema: <span id="tema"></span>

        <button class="refresh" id="refresh-tema" aria-label="Sortear outro tema">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"></path>
                <path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"></path>
            </svg>
        </button>
    </p>


    <p id="resultado-cor">
        Cor principal: <span id="cor"></span>

        <button class="refresh" id="refresh-cor" aria-label="Sortear outra cor principal">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"></path>
                <path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"></path>
            </svg>
        </button>
    </p>


    <p id="resultado-cor-secundaria">
        Cor secundária: <span id="cor-secundaria"></span>

        <button class="refresh" id="refresh-cor-secundaria" aria-label="Sortear outra cor secundária">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"></path>
                <path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"></path>
            </svg>
        </button>
    </p>


    <p id="resultado-material">
        Material: <span id="material"></span>

        <button class="refresh" id="refresh-material" aria-label="Sortear outro material">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"></path>
                <path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"></path>
            </svg>
        </button>
    </p>


    <p id="resultado-estampa">
        Estampa: <span id="estampa"></span>

        <button class="refresh" id="refresh-estampa" aria-label="Sortear outra estampa">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"></path>
                <path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"></path>
            </svg>
        </button>
    </p>


    <p id="resultado-linguagem">
        Linguagem: <span id="linguagem"></span>

        <button class="refresh" id="refresh-linguagem" aria-label="Sortear outra linguagem">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"></path>
                <path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"></path>
            </svg>
        </button>
    </p>


    <p id="resultado-atmosfera">
        Atmosfera: <span id="atmosfera"></span>

        <button class="refresh" id="refresh-atmosfera" aria-label="Sortear outra atmosfera">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"></path>
                <path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"></path>
            </svg>
        </button>
    </p>


    <p id="resultado-universo">
        Universo: <span id="universo"></span>

        <button class="refresh" id="refresh-universo" aria-label="Sortear outro universo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"></path>
                <path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"></path>
            </svg>
        </button>
    </p>


    <p id="resultado-construcao">
        Construção: <span id="construcao"></span>

        <button class="refresh" id="refresh-construcao" aria-label="Sortear outra construção">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"></path>
                <path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"></path>
            </svg>
        </button>
    </p>


    <!-- =====================================================
         ANOTAÇÃO
         ===================================================== -->

    <div id="anotacao-container">

        <h3>Sua ideia</h3>

        <textarea
            id="anotacao"
            placeholder="Escreva aqui sua interpretação, referências ou ideias para desenvolver este resultado..."
        ></textarea>


        <div class="acoes-anotacao">

            <button id="copiar-resultado">
                COPIAR RESULTADO
            </button>

        </div>

    </div>

    <!-- =====================================================
     RODAPÉ / ASSINATURA
     ===================================================== -->

<footer>

    <p>IDEALIZADO POR FABIULA ANDRADE</p>

    <div class="redes-sociais">

        <!-- Instagram -->
        <a
            href="https://www.instagram.com/fabiula.lab/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="17.5" cy="6.5" r="1"></circle>
            </svg>
        </a>


        <!-- LinkedIn -->
        <a
            href="https://www.linkedin.com/in/fabiula-andrade/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 8v10"></path>
                <path d="M6 5.5v.1"></path>
                <path d="M10 18v-6"></path>
                <path d="M10 15c0-2.2 1.2-3.5 3-3.5s3 1.3 3 3.5v3"></path>
                <path d="M16 18v-4"></path>
            </svg>
        </a>


        <!-- Behance -->
        <a
            href="https://www.behance.net/fabiula-andrade"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Behance"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5h6c2.5 0 4 1.2 4 3.2 0 1.3-.7 2.3-1.8 2.8 1.5.4 2.4 1.5 2.4 3.1 0 2.4-1.8 3.9-4.6 3.9H4V5z"></path>
                <path d="M7 7.5v2.5h2.7c1 0 1.6-.5 1.6-1.3s-.6-1.2-1.6-1.2H7z"></path>
                <path d="M7 12.5v3h3c1.1 0 1.8-.5 1.8-1.5s-.7-1.5-1.8-1.5H7z"></path>
                <path d="M17 11.5c.3-1.2 1.1-1.9 2.1-1.9 1.1 0 1.8.7 2 1.9H17z"></path>
                <path d="M16.8 13h5.1c0-2.8-1.3-4.5-3.8-4.5-2.5 0-4.2 1.8-4.2 4.4 0 2.8 1.7 4.6 4.4 4.6 1.9 0 3.2-.8 3.9-2.2"></path>
                <path d="M17.5 6h3"></path>
            </svg>
        </a>

    </div>

</footer>

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>

</body>

</html>
